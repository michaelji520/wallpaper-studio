<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wallpaper Studio · 壁纸预览台</title>
<meta name="description" content="按真机尺寸 1:1 预览手机壁纸：iPhone 与 Android 多机型、灵动岛/刘海/水滴开孔、图片与视频壁纸、环境背景。" />
<link rel="canonical" href="https://wallpaper-studio.heihei2thesky.top/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="壁纸预览台 · Wallpaper Studio" />
<meta property="og:description" content="按真机尺寸 1:1 预览手机壁纸，支持 iPhone / Android 多机型与图片、视频壁纸。" />
<meta property="og:url" content="https://wallpaper-studio.heihei2thesky.top/" />
<meta name="theme-color" content="#07080a" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0b0d'/%3E%3Crect x='9' y='5' width='14' height='22' rx='4' fill='none' stroke='%23e0c9a6' stroke-width='1.6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><i></i></span>
      <span class="brand-text"><b>Wallpaper Studio</b><em>壁纸预览台</em></span>
    </div>

    <div class="export-bar">
      <button class="ebtn" id="exportImg" title="导出内容区 2K PNG">2K 图片</button>
      <button class="ebtn" id="exportVid" title="录制内容区 2K 视频（需视频壁纸）">2K 视频</button>
    </div>

    <div class="zoom-bar">
      <div class="zoom-btns">
        <button class="zbtn" id="fitBtn" data-zoom="fit" title="适应窗口（快捷键 F）">适应</button>
        <button class="zbtn" id="oneBtn" data-zoom="one" title="逻辑尺寸 1:1（快捷键 1）">1:1</button>
      </div>
      <div class="zoom-range">
        <input type="range" id="zoomRange" min="20" max="160" step="1" value="80" aria-label="缩放" />
        <output id="zoomOut" class="mono">80%</output>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <aside class="panel">
      <div class="panel-head">
        <div class="panel-title"><b>控制台</b><span>Studio Controls</span></div>
        <button class="mini" id="resetBtn">重置</button>
      </div>

      <div class="panel-scroll">

        <section class="sec">
          <div class="sec-head"><b>设备</b><i>01 / DEVICE</i></div>

          <div class="seg" id="osSeg" style="--n:2;--i:0">
            <span class="seg-thumb"></span>
            <button data-os="ios" class="on">iOS</button>
            <button data-os="android">Android</button>
          </div>

          <div class="select-wrap">
            <select id="deviceSelect" class="select" aria-label="选择机型"></select>
            <svg class="chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5l5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>

          <div class="meta" id="deviceMeta">6.9″ · 440 × 956 pt · 78.0 × 163.4 mm</div>

          <div class="label-row"><span>屏幕开孔</span><i id="cutoutLabel">灵动岛</i></div>
          <div class="seg small" id="cutoutSeg" style="--n:4;--i:0">
            <span class="seg-thumb"></span>
            <button data-cutout="island" class="on">灵动岛</button>
            <button data-cutout="notch">刘海</button>
            <button data-cutout="waterdrop">水滴</button>
            <button data-cutout="punch">挖孔</button>
          </div>
        </section>

        <section class="sec">
          <div class="sec-head"><b>壁纸</b><i>02 / WALLPAPER</i></div>

          <label class="drop" id="dropZone">
            <input type="file" id="fileInput" accept="image/*,video/*" hidden />
            <svg class="drop-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.6" cy="9.6" r="1.6"/><path d="M3.6 17.4 9 12.6l3.4 3 2.8-2.4 5.2 4.2"/>
            </svg>
            <span class="drop-text">
              <b class="drop-title">拖入或点击上传</b>
              <em class="drop-sub">JPG / PNG / WEBP / MP4 · 视频静音循环</em>
            </span>
          </label>

          <div class="url-row">
            <input class="input" id="urlInput" type="text" placeholder="粘贴图片 / 视频 URL" spellcheck="false" />
            <button class="btn" id="urlBtn">应用</button>
          </div>

          <div class="label-row">
            <span>预设壁纸</span>
            <span class="lr-right"><i id="mediaName">沙丘</i><button class="link" id="clearMedia">清除</button></span>
          </div>
          <div class="presets" id="presets"></div>

          <div class="video-tools" id="videoTools" hidden>
            <button class="mini wide" id="videoToggle">暂停视频</button>
            <label class="mini-check"><input type="checkbox" id="loopToggle" checked /><span>循环</span></label>
          </div>

          <div class="seg small mt10" id="fitSeg" style="--n:2;--i:0">
            <span class="seg-thumb"></span>
            <button data-fit="cover" class="on">填充</button>
            <button data-fit="contain">适应</button>
          </div>
        </section>

        <section class="sec">
          <div class="sec-head"><b>环境</b><i>03 / STAGE</i></div>
          <div class="swatches" id="swatches">
            <button class="swatch swatch-add" id="envUploadBtn" title="上传背景图" aria-label="上传背景图">
              <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6v10.8M1.6 7h10.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
            <input type="file" id="envFile" accept="image/*" hidden />
          </div>

          <div class="slider-row">
            <span>虚化</span>
            <input type="range" id="blurRange" min="0" max="40" step="1" value="0" />
            <b class="mono" id="blurVal">0</b>
          </div>
          <div class="slider-row">
            <span>亮度</span>
            <input type="range" id="dimRange" min="30" max="120" step="1" value="100" />
            <b class="mono" id="dimVal">100%</b>
          </div>
        </section>

        <section class="sec last">
          <div class="sec-head"><b>显示</b><i>04 / DISPLAY</i></div>

          <label class="row">
            <span>锁屏界面<em>时间 · 状态栏 · 小白条</em></span>
            <span class="switch"><input type="checkbox" id="lockToggle" checked /><i></i></span>
          </label>

          <label class="row">
            <span>屏幕反光<em>玻璃高光与暗角</em></span>
            <span class="switch"><input type="checkbox" id="glossToggle" checked /><i></i></span>
          </label>

        </section>

      </div>
    </aside>
    <div class="viewport" id="viewport">
      <div class="env" id="env"></div>
      <div class="env-grain"></div>

      <div class="canvas-area" id="canvasArea">
        <div class="scaler" id="scaler">
          <span class="btn-side act" aria-hidden="true"></span>
          <span class="btn-side vup" aria-hidden="true"></span>
          <span class="btn-side vdn" aria-hidden="true"></span>
          <span class="btn-side pwr" aria-hidden="true"></span>
          <span class="btn-side cc" aria-hidden="true"></span>

          <div class="device" id="device">
            <div class="bezel" id="bezel">
              <div class="screen" id="screen">
                <div class="media" id="media"></div>
                <div class="vignette"></div>
                <div class="gloss" id="gloss"></div>

                <div class="chrome" id="chrome">
                  <div class="statusbar">
                    <span class="sb-icons">
                      <!-- 蜂窝信号：18×12pt，四根圆角柱 -->
                      <svg class="sb-cell" viewBox="0 0 18 12" aria-hidden="true">
                        <rect x="0" y="7.9" width="3.2" height="4.1" rx="1"/>
                        <rect x="4.9" y="5.5" width="3.2" height="6.5" rx="1"/>
                        <rect x="9.8" y="3" width="3.2" height="9" rx="1"/>
                        <rect x="14.7" y="0" width="3.2" height="12" rx="1"/>
                      </svg>
                      <!-- Wi-Fi：15.6×12.1pt，两段同心弧带（端点沿径向斜切）+ 圆点 -->
                      <svg class="sb-wifi" viewBox="0 0 15.6 12.1" aria-hidden="true">
                        <path d="M0.31 3.29A10.5 10.5 0 0 1 15.29 3.29L13.49 5.06A7.98 7.98 0 0 0 2.11 5.06Z"/>
                        <path d="M3.55 6.47A5.96 5.96 0 0 1 12.05 6.47L10.25 8.24A3.44 3.44 0 0 0 5.35 8.24Z"/>
                        <circle cx="7.8" cy="10.65" r="1.42"/>
                      </svg>
                      <!-- 电池：27×13pt，外框 38% 不透明 + 实心电量 + 电极 -->
                      <svg class="sb-batt" viewBox="0 0 27 13" aria-hidden="true">
                        <rect x="0.55" y="0.55" width="23.9" height="11.9" rx="3.7" style="fill:none" stroke="currentColor" stroke-width="1.1" opacity=".42"/>
                        <rect x="2.4" y="2.4" width="15" height="8.2" rx="2.1" fill="currentColor"/>
                        <rect x="25.4" y="4.4" width="1.3" height="4.2" rx=".65" fill="currentColor" opacity=".42"/>
                      </svg>
                    </span>
                  </div>

                  <div class="lockscreen" id="lockscreen">
                    <div class="lock-main">
                      <div class="lock-date" id="lockDate">11月20日 星期五</div>
                      <div class="lock-time" id="lockTime">9:41</div>
                    </div>
                    <div class="lock-orbs">
                      <span class="orb">
                        <!-- 手电筒 flashlight.off.fill -->
                        <svg viewBox="0 0 24 24" class="ic-flash" aria-hidden="true">
                          <path d="M8.3 3.3c0-.5.4-.9.9-.9h5.6c.5 0 .9.4.9.9v.2l-1.16 5.5a.86.86 0 0 1-.84.68h-3.4a.86.86 0 0 1-.84-.68L8.3 3.5v-.2Z"/>
                          <path d="M10.3 9.9h3.4v8.6a1.7 1.7 0 0 1-3.4 0V9.9Z"/>
                        </svg>
                      </span>
                      <span class="orb">
                        <!-- 相机 camera.fill -->
                        <svg viewBox="0 0 24 24" class="ic-cam" aria-hidden="true">
                          <path fill-rule="evenodd" d="M2.2 17.6V9.4a2.6 2.6 0 0 1 2.6-2.6h2.5l1.2-2.1c.2-.4.7-.7 1.1-.7h2.8c.4 0 .9.3 1.1.7l1.2 2.1h2.5a2.6 2.6 0 0 1 2.6 2.6v8.2a2.6 2.6 0 0 1-2.6 2.6H4.8a2.6 2.6 0 0 1-2.6-2.6Zm9.8-1a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z"/>
                        </svg>
                      </span>
                    </div>
                  </div>

                  <div class="home-bar"></div>
                </div>

                <div class="cutout" id="cutout" data-cutout="island"><span class="cam"></span></div>
              </div>
            </div>
          </div>
        </div>
      </div>


      <div class="drop-veil" id="dropVeil"><span>松开以应用壁纸</span></div>

      <div class="toast" id="toast"></div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
