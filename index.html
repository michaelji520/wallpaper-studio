<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wallpaper Studio · 壁纸预览台</title>
<meta name="description" content="按真机尺寸 1:1 预览手机壁纸：iPhone 与 Android 多机型、灵动岛/刘海/水滴开孔、图片与视频壁纸、环境背景。" />
<link rel="canonical" href="https://wallpaper-studio.heihei2thesky.top/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="壁纸预览台 · Wallpaper Studio" />
<meta property="og:description" content="按真机尺寸 1:1 预览手机壁纸，支持 iPhone / Android 多机型与图片、视频壁纸。" />
<meta property="og:url" content="https://wallpaper-studio.heihei2thesky.top/" />
<meta name="theme-color" content="#07080a" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0b0d'/%3E%3Crect x='9' y='5' width='14' height='22' rx='4' fill='none' stroke='%23e0c9a6' stroke-width='1.6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><i></i></span>
      <span class="brand-text"><b>Wallpaper Studio</b><em>壁纸预览台</em></span>
    </div>

    <div class="export-bar">
      <button class="ebtn" id="exportImg" title="导出内容区 2K PNG">2K 图片</button>
      <button class="ebtn" id="exportVid" title="录制内容区 2K 视频（需视频壁纸）">2K 视频</button>
    </div>

    <div class="zoom-bar">
      <div class="zoom-btns">
        <button class="zbtn" id="fitBtn" data-zoom="fit" title="适应窗口（快捷键 F）">适应</button>
        <button class="zbtn" id="oneBtn" data-zoom="one" title="逻辑尺寸 1:1（快捷键 1）">1:1</button>
      </div>
      <div class="zoom-range">
        <input type="range" id="zoomRange" min="20" max="160" step="1" value="80" aria-label="缩放" />
        <output id="zoomOut" class="mono">80%</output>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <aside class="panel">
      <div class="panel-head">
        <div class="panel-title"><b>控制台</b><span>Studio Controls</span></div>
        <button class="mini" id="resetBtn">重置</button>
      </div>

      <div class="panel-scroll">

        <section class="sec">
          <div class="sec-head"><b>设备</b><i>01 / DEVICE</i></div>

          <div class="seg" id="osSeg" style="--n:2;--i:0">
            <span class="seg-thumb"></span>
            <button data-os="ios" class="on">iOS</button>
            <button data-os="android">Android</button>
          </div>

          <div class="select-wrap">
            <select id="deviceSelect" class="select" aria-label="选择机型"></select>
            <svg class="chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5 6 6.5l5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>

          <div class="meta" id="deviceMeta">6.9″ · 440 × 956 pt · 78.0 × 163.4 mm</div>

          <div class="label-row"><span>屏幕开孔</span><i id="cutoutLabel">灵动岛</i></div>
          <div class="seg small" id="cutoutSeg" style="--n:4;--i:0">
            <span class="seg-thumb"></span>
            <button data-cutout="island" class="on">灵动岛</button>
            <button data-cutout="notch">刘海</button>
            <button data-cutout="waterdrop">水滴</button>
            <button data-cutout="punch">挖孔</button>
          </div>
        </section>

        <section class="sec">
          <div class="sec-head"><b>壁纸</b><i>02 / WALLPAPER</i></div>

          <label class="drop" id="dropZone">
            <input type="file" id="fileInput" accept="image/*,video/*" hidden />
            <svg class="drop-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.6" cy="9.6" r="1.6"/><path d="M3.6 17.4 9 12.6l3.4 3 2.8-2.4 5.2 4.2"/>
            </svg>
            <span class="drop-text">
              <b class="drop-title">拖入或点击上传</b>
              <em class="drop-sub">JPG / PNG / WEBP / MP4 · 视频静音循环</em>
            </span>
          </label>

          <div class="url-row">
            <input class="input" id="urlInput" type="text" placeholder="粘贴图片 / 视频 URL" spellcheck="false" />
            <button class="btn" id="urlBtn">应用</button>
          </div>

          <div class="label-row">
            <span>预设壁纸</span>
            <span class="lr-right"><i id="mediaName">沙丘</i><button class="link" id="clearMedia">清除</button></span>
          </div>
          <div class="presets" id="presets"></div>

          <div class="video-tools" id="videoTools" hidden>
            <button class="mini wide" id="videoToggle">暂停视频</button>
            <label class="mini-check"><input type="checkbox" id="loopToggle" checked /><span>循环</span></label>
          </div>

          <div class="seg small mt10" id="fitSeg" style="--n:2;--i:0">
            <span class="seg-thumb"></span>
            <button data-fit="cover" class="on">填充</button>
            <button data-fit="contain">适应</button>
          </div>
        </section>

        <section class="sec">
          <div class="sec-head"><b>环境</b><i>03 / STAGE</i></div>
          <div class="swatches" id="swatches">
            <button class="swatch swatch-add" id="envUploadBtn" title="上传背景图" aria-label="上传背景图">
              <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6v10.8M1.6 7h10.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
            <input type="file" id="envFile" accept="image/*" hidden />
          </div>

          <div class="slider-row">
            <span>虚化</span>
            <input type="range" id="blurRange" min="0" max="40" step="1" value="0" />
            <b class="mono" id="blurVal">0</b>
          </div>
          <div class="slider-row">
            <span>亮度</span>
            <input type="range" id="dimRange" min="30" max="120" step="1" value="100" />
            <b class="mono" id="dimVal">100%</b>
          </div>
        </section>

        <section class="sec last">
          <div class="sec-head"><b>显示</b><i>04 / DISPLAY</i></div>

          <label class="row">
            <span>锁屏界面<em>时间 · 状态栏 · 小白条</em></span>
            <span class="switch"><input type="checkbox" id="lockToggle" checked /><i></i></span>
          </label>

          <label class="row">
            <span>屏幕反光<em>玻璃高光与暗角</em></span>
            <span class="switch"><input type="checkbox" id="glossToggle" checked /><i></i></span>
          </label>

          <div class="slider-row glass-row" title="液态玻璃浓度：0 极清透 · 100 全着色">
            <span>玻璃</span>
            <input type="range" id="glassRange" min="0" max="100" step="5" value="60" aria-label="液态玻璃浓度" />
            <b id="glassVal">60</b>
          </div>

        </section>

      </div>
    </aside>
    <div class="viewport" id="viewport">
      <div class="env" id="env"></div>
      <div class="env-grain"></div>

      <div class="canvas-area" id="canvasArea">
        <div class="scaler" id="scaler">
          <span class="btn-side act" aria-hidden="true"></span>
          <span class="btn-side vup" aria-hidden="true"></span>
          <span class="btn-side vdn" aria-hidden="true"></span>
          <span class="btn-side pwr" aria-hidden="true"></span>
          <span class="btn-side cc" aria-hidden="true"></span>

          <div class="device" id="device">
            <div class="bezel" id="bezel">
              <div class="screen" id="screen">
                <div class="media" id="media"></div>
                <div class="vignette"></div>
                <div class="gloss" id="gloss"></div>

                <div class="chrome" id="chrome">
                  <div class="statusbar">
                    <span class="sb-icons">
                      <!-- 蜂窝信号：SF Symbols cellularbars（Large / Regular），导出为矢量路径 -->
                      <svg class="sb-cell" viewBox="0 0 1554 1000" aria-hidden="true">
                        <path d="M1354.263 1000L1494.24 1000C1529.954 1000 1554.147 974.654 1554.147 937.212L1554.147 62.788C1554.147 25.346 1529.954 0 1494.24 0L1354.263 0C1318.548 0 1293.779 25.346 1293.779 62.788L1293.779 937.212C1293.779 974.654 1318.548 1000 1354.263 1000ZM923.387 1000L1062.212 1000C1097.926 1000 1122.696 974.654 1122.696 937.212L1122.696 290.323C1122.696 252.88 1097.926 227.535 1062.212 227.535L923.387 227.535C887.097 227.535 862.903 252.88 862.903 290.323L862.903 937.212C862.903 974.654 887.097 1000 923.387 1000ZM491.935 1000L630.76 1000C667.051 1000 691.244 974.654 691.244 937.212L691.244 498.848C691.244 461.406 667.051 436.06 630.76 436.06L491.935 436.06C455.645 436.06 431.452 461.406 431.452 498.848L431.452 937.212C431.452 974.654 455.645 1000 491.935 1000ZM60.484 1000L199.309 1000C235.599 1000 259.793 974.654 259.793 937.212L259.793 678.571C259.793 641.129 235.599 616.359 199.309 616.359L60.484 616.359C24.194 616.359 0 641.129 0 678.571L0 937.212C0 974.654 24.194 1000 60.484 1000Z"/>
                      </svg>
                      <!-- Wi-Fi：SF Symbols wifi（Large / Regular），导出为矢量路径 -->
                      <svg class="sb-wifi" viewBox="0 0 1390 1000" aria-hidden="true">
                        <path d="M93.261 421.179C105.295 432.611 122.142 432.611 133.574 420.578C281.588 263.538 476.534 180.505 694.946 180.505C914.561 180.505 1110.71 264.14 1257.521 421.179C1268.351 432.01 1284.597 431.408 1296.631 419.976L1379.663 336.943C1390.493 326.113 1389.892 312.876 1381.468 302.647C1240.072 128.159 974.128 0 694.946 0C416.366 0 149.218 128.159 8.424 302.647C0 312.876 0 326.113 10.229 336.943ZM342.96 672.684C356.197 685.319 372.443 683.514 384.477 670.277C456.679 590.253 574.609 531.889 694.946 532.491C816.486 531.889 934.416 592.058 1007.822 672.082C1018.652 684.717 1033.694 684.116 1046.931 672.082L1140.193 579.422C1149.819 569.795 1151.023 556.558 1141.998 545.728C1051.143 434.416 882.671 350.782 694.946 350.782C507.22 350.782 338.748 434.416 247.894 545.728C238.869 556.558 239.471 568.592 249.699 579.422ZM694.946 1000C708.183 1000 719.615 993.983 743.081 971.119L889.892 830.325C898.917 821.3 901.324 808.063 892.9 797.232C853.791 746.691 779.783 702.768 694.946 702.768C607.702 702.768 533.694 748.496 494.585 800.842C488.568 810.469 490.975 821.3 500.602 830.325L646.811 971.119C670.277 993.381 681.709 1000 694.946 1000Z"/>
                      </svg>
                      <!-- 电池：27×13pt，外框 38% 不透明 + 实心电量 + 电极 -->
                      <svg class="sb-batt" viewBox="0 0 27 13" aria-hidden="true">
                        <rect x="0.55" y="0.55" width="23.9" height="11.9" rx="3.7" style="fill:none" stroke="currentColor" stroke-width="1.1" opacity=".55"/>
                        <rect x="2.3" y="2.3" width="20.4" height="8.4" rx="2.2" fill="currentColor"/>
                        <rect x="25.4" y="4.4" width="1.3" height="4.2" rx=".65" fill="currentColor" opacity=".55"/>
                      </svg>
                    </span>
                  </div>

                  <div class="lockscreen" id="lockscreen">
                    <div class="lock-main">
                      <div class="lock-date" id="lockDate">11月20日 星期五</div>
                      <div class="lock-time" id="lockTime">9:41</div>
                    </div>
                    <div class="lock-orbs">
                      <span class="orb">
                        <!-- 手电筒：SF Symbols flashlight.off.fill -->
                      <svg viewBox="0 0 415 1000" class="ic-flash" aria-hidden="true">
                        <path d="M167.936 1000L247.039 1000C300.338 1000 328.68 971.658 328.68 916.667L328.68 425.973C328.68 379.019 339.255 347.293 356.176 321.066L380.288 283.418C401.015 250.846 414.975 222.927 414.975 185.279L414.975 146.785L0 146.785L0 185.279C0 222.927 13.959 250.846 34.687 283.418L58.799 321.066C75.719 347.293 86.294 379.019 86.294 425.973L86.294 916.667C86.294 971.658 114.636 1000 167.936 1000ZM0 97.716L414.975 97.716L414.975 83.333C414.975 27.073 387.479 0 333.333 0L81.218 0C27.073 0 0 27.073 0 83.333ZM132.826 466.159C132.826 424.704 165.398 391.709 207.699 391.709C249.577 391.709 282.149 424.704 282.149 466.159L282.149 593.909C282.149 635.787 249.577 668.359 207.699 668.359C165.398 668.359 132.826 635.787 132.826 593.909ZM207.699 642.132C235.618 642.132 255.922 621.827 255.922 593.909C255.922 567.682 234.349 546.108 207.699 546.108C180.626 546.108 159.052 567.682 159.052 593.909C159.052 621.827 179.78 642.132 207.699 642.132Z"/>
                      </svg>
                      </span>
                      <span class="orb">
                        <!-- 相机：SF Symbols camera.fill -->
                      <svg viewBox="0 0 1288 1000" class="ic-cam" aria-hidden="true">
                        <path d="M164.657 1000L1123.23 1000C1232.302 1000 1287.887 945.464 1287.887 837.441L1287.887 288.411C1287.887 180.388 1232.302 126.377 1123.23 126.377L973.256 126.377C931.83 126.377 919.245 117.986 895.648 91.767L853.697 44.573C827.478 15.732 800.734 0 746.723 0L537.493 0C483.482 0 456.738 15.732 430.519 44.573L388.568 91.767C364.971 117.462 351.862 126.377 310.96 126.377L164.657 126.377C55.06 126.377 0 180.388 0 288.411L0 837.441C0 945.464 55.06 1000 164.657 1000ZM643.943 845.307C485.055 845.307 357.63 718.406 357.63 558.469C357.63 399.056 485.055 272.155 643.943 272.155C802.832 272.155 929.733 399.056 929.733 558.469C929.733 718.406 802.307 845.307 643.943 845.307ZM643.943 765.6C758.259 765.6 850.551 673.833 850.551 558.469C850.551 443.629 758.259 351.337 643.943 351.337C529.628 351.337 436.812 443.629 436.812 558.469C436.812 673.833 530.152 765.6 643.943 765.6ZM964.866 365.496C964.866 329.837 996.329 298.374 1033.036 298.374C1069.219 298.374 1100.157 329.837 1100.157 365.496C1100.157 402.727 1069.219 432.617 1033.036 433.141C996.329 433.141 964.866 403.251 964.866 365.496Z"/>
                      </svg>
                      </span>
                    </div>
                  </div>

                  <div class="home-bar"></div>
                </div>

                <div class="cutout" id="cutout" data-cutout="island"><span class="cam"></span></div>
              </div>
            </div>
          </div>
        </div>
      </div>


      <div class="drop-veil" id="dropVeil"><span>松开以应用壁纸</span></div>

      <div class="toast" id="toast"></div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
